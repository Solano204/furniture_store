name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values so prisma generate / next build succeed without live
      # services - `prisma generate` only reads schema.prisma, it doesn't
      # connect to DATABASE_URL. Real values live in repo/environment secrets
      # for the docker job below.
      DATABASE_URL: postgresql://user:password@localhost:5432/furniture_store
      DIRECT_URL: postgresql://user:password@localhost:5432/furniture_store
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:8080/graphql
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_KEY: placeholder
      ADMIN_USER_ID: placeholder
      SECRET: ci-only-placeholder-secret-not-used-in-prod
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Real values must be set as repository secrets (Settings > Secrets and
      # variables > Actions) before this produces a working image - without
      # them the image builds but points at placeholder services.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_GRAPHQL_URL=${{ secrets.NEXT_PUBLIC_GRAPHQL_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DIRECT_URL=${{ secrets.DIRECT_URL }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            ADMIN_USER_ID=${{ secrets.ADMIN_USER_ID }}
            SECRET=${{ secrets.SECRET }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
