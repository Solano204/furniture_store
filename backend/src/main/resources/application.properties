spring.application.name=furniture-store-backend
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# MongoDB (reactive). Decomposed instead of a single spring.data.mongodb.uri
# so the password can be injected separately via Spring's configtree config-data
# import (see docker-compose.yaml/Doc 2) without string-concatenating a secret
# into a URI. Username/password are blank by default for existing local dev
# setups that still run Mongo without auth - only meaningful once both are set.
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:furniture_store}
# The non-blank "unused" default (not a bare empty string) works around a
# Spring Boot binder bug: binding a blank String to a char[]-typed property
# (as MongoProperties.password is) throws a NullPointerException at startup -
# and Spring trims the value first, so even a whitespace-only default still
# hits it. A blank username still means no MongoCredential is ever built, so
# this placeholder is never actually used for auth.
spring.data.mongodb.username=${MONGODB_USERNAME:}
spring.data.mongodb.password=${MONGODB_PASSWORD:unused}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DATABASE:admin}
# Spring Data MongoDB does NOT create indexes from @Indexed/@CompoundIndex
# annotations by default - without this, every index added in Doc 5 is
# decorative only.
spring.data.mongodb.auto-index-creation=true

# JWT
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# GraphQL operations reachable without a Bearer token. Everything else goes through
# GraphQlSecurityInterceptor's token check. register/authenticate have to be here or
# nobody could ever log in; the rest are genuinely public storefront browsing.
graphql.queries-to-check=getFeaturedProducts,getProductById,searchProducts,getProductReviews,getReviewAggregate
graphql.mutations-to-check=register,authenticate,refreshToken

# Requires ROLE_ADMIN on top of the general authenticated check: catalog
# management and the cross-user order list.
graphql.admin-operations=createProduct,updateProduct,updateProductImage,deleteProduct,getOrders

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Tracing (Doc 7) - 100% sampling for local dev, drop before pointing at
# anything shared/persistent.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
