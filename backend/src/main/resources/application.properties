spring.application.name=furniture-store-backend
server.port=${SERVER_PORT:8080}

# MongoDB (reactive)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/furniture_store}

# JWT
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# GraphQL operations reachable without a Bearer token. Everything else goes through
# GraphQlSecurityInterceptor's token check. register/authenticate have to be here or
# nobody could ever log in; the rest are genuinely public storefront browsing.
graphql.queries-to-check=getFeaturedProducts,getProductById,searchProducts,getProductReviews,getReviewAggregate
graphql.mutations-to-check=register,authenticate,refreshToken

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
