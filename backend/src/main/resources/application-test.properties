spring.application.name=furniture-store-backend
server.port=8080

# MongoDB (reactive) - dummy URI, no live connection needed for context-load-only tests
# since ReactiveMongoTemplate connects lazily.
spring.data.mongodb.uri=mongodb://localhost:27017/furniture_store_test

# JWT - test-only key, never used outside this profile
application.security.jwt.secret-key=dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdW5pdC10ZXN0cy1vbmx5LW5vdC1wcm9kLTMyYnl0ZXM=
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

graphql.queries-to-check=getFeaturedProducts,getProductById,searchProducts,getProductReviews,getReviewAggregate
graphql.mutations-to-check=register,authenticate,refreshToken

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
